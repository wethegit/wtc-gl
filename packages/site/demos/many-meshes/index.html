<!doctype html>
<html lang="en" class="demo-fullscreen">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wtc-gl — Many meshes</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .count {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0.5em;
        color: rgba(221, 224, 238, 0.7);
      }
      .count select {
        font: inherit;
        color: #fff;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        padding: 0.2em 0.4em;
      }
      .pane {
        position: fixed;
        z-index: 1;
        box-sizing: border-box;
      }
      body {
        /* Dragging to orbit shouldn't select text */
        user-select: none;
      }
      #pane-main {
        cursor: grab;
        touch-action: none;
      }
      #pane-overview {
        pointer-events: none;
        border-left: 1px solid rgba(255, 255, 255, 0.15);
      }
      #pane-overview.pane--stacked {
        border-left: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
      }
      .pane__label {
        position: absolute;
        left: 1em;
        top: 0.75em;
        font:
          12px/1.4 system-ui,
          sans-serif;
        color: rgba(221, 224, 238, 0.7);
        pointer-events: none;
      }
      .pane--top .pane__label {
        top: calc(var(--nav-offset) + 12px);
      }
      .hud {
        position: fixed;
        left: 1em;
        bottom: 1em;
        z-index: 100;
        padding: 0.6em 0.9em;
        border-radius: 6px;
        background: rgba(7, 7, 14, 0.75);
        backdrop-filter: blur(8px);
        font:
          12px/1.6 ui-monospace,
          monospace;
        color: rgba(221, 224, 238, 0.85);
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <header class="site-nav">
      <nav class="site-nav__crumbs" aria-label="Breadcrumb">
        <a class="site-nav__brand" href="../../docs/"
          ><svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path
              d="M16 3 29 27H3Z"
              fill="#4a9eff"
              fill-opacity=".18"
              stroke="#4a9eff"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <path d="M16 13 22.5 25h-13Z" fill="#4a9eff" /></svg
          ><span>wtc-gl</span></a
        >
        <span class="site-nav__sep">/</span>
        <a class="site-nav__demos" href="../">Demos</a>
        <span class="site-nav__sep">/</span>
        <span class="site-nav__current" aria-current="page">Many meshes</span>
      </nav>
      <div class="site-nav__tools">
        <label class="count">
          Meshes
          <select id="count">
            <option value="1000">1,000</option>
            <option value="3000" selected>3,000</option>
            <option value="6000">6,000</option>
          </select>
        </label>
        <label class="count">
          As
          <select id="mode">
            <option value="separate" selected>separate meshes</option>
            <option value="instanced">one InstancedMesh</option>
          </select>
        </label>
      </div>
      <nav class="site-nav__links" aria-label="Site">
        <a href="../../docs/">Docs</a>
        <a class="site-nav__api" href="../../docs/api/wtc-gl/">API</a>
        <a href="../" aria-current="page">Demos</a>
        <a
          class="site-nav__icon"
          href="https://github.com/wethegit/wtc-gl"
          aria-label="GitHub"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.82-.26.82-.57v-2.04c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18a4.65 4.65 0 0 1 1.23 3.22c0 4.61-2.8 5.62-5.48 5.92.43.37.82 1.1.82 2.22v3.29c0 .32.21.69.82.57A12 12 0 0 0 12 .3"
            /></svg
        ></a>
      </nav>
    </header>
    <div class="pane" id="pane-main">
      <span class="pane__label"
        >Camera view · drag to orbit, scroll to zoom</span
      >
    </div>
    <div class="pane" id="pane-overview">
      <span class="pane__label"
        >Overview · the camera, its frustum, and only the meshes it didn't
        cull</span
      >
    </div>
    <div class="hud" id="hud" aria-live="off"></div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
