<!doctype html>
<html lang="en" class="demo-fullscreen">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wtc-gl — Particle trails</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      canvas {
        cursor: grab;
        touch-action: none;
      }
      .demo-nav button {
        margin-left: auto;
        font: inherit;
        color: rgba(221, 224, 238, 0.85);
        background: none;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        padding: 0.25em 0.75em;
        cursor: pointer;
      }
      #controls {
        position: fixed;
        top: calc(3em + 8px);
        right: 8px;
        z-index: 100;
        width: 260px;
      }
      .hint {
        position: fixed;
        left: 1em;
        bottom: 1em;
        z-index: 100;
        font:
          12px/1.4 ui-monospace,
          monospace;
        color: rgba(255, 255, 255, 0.6);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <nav class="demo-nav">
      <a class="demo-nav__brand" href="../">wtc-gl</a>
      <span class="demo-nav__sep">/</span>
      <span class="demo-nav__title">Particle trails</span>
      <button id="play" type="button" aria-pressed="false">Pause</button>
    </nav>
    <div id="controls"></div>
    <div class="hint">
      drag to orbit · right-drag to pan · scroll to zoom · click for the next
      shot
    </div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
