<!doctype html>
<html lang="en" class="demo-fullscreen">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wtc-gl — Primitives</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      canvas {
        touch-action: none;
      }
      #controls {
        position: fixed;
        top: calc(3em + 8px);
        right: 8px;
        z-index: 100;
        width: 280px;
        max-height: calc(100vh - 3em - 16px);
        overflow-y: auto;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .label {
        position: absolute;
        left: 0;
        top: 0;
        transform: translate(-50%, 0);
        font:
          500 12px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #3b3a44;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <nav class="demo-nav">
      <a class="demo-nav__brand" href="../">wtc-gl</a>
      <span class="demo-nav__sep">/</span>
      <span class="demo-nav__title">Primitives</span>
    </nav>
    <div id="labels"></div>
    <div id="controls"></div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
