# Dependabot version updates. Reviewers come from .github/CODEOWNERS; the
# `reviewers` option was removed from this file in 2025.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 'npm' covers pnpm too: Dependabot reads pnpm-lock.yaml and the workspace
  # packages from the root
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    # One PR a week for all minor and patch bumps, rather than one per package
    groups:
      dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    groups:
      actions:
        patterns:
          - '*'
