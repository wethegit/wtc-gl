name: Release

on:
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'

      # No npm step: pnpm (11+) publishes natively and handles the trusted
      # publishing (OIDC) token exchange itself, so the npm CLI isn't involved.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Create release pull request or publish
        uses: changesets/action@v2
        with:
          github-token: ${{ github.token }}
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: 'chore: release packages'
          pr-title: 'chore: release packages'
          create-github-releases: true
          push-git-tags: true
        env:
          # Read by @changesets/changelog-github to link PRs and authors
          GITHUB_TOKEN: ${{ github.token }}
